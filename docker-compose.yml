services:
  db:
    image: pgvector/pgvector:pg17
    container_name: aimbank-db
    environment:
      POSTGRES_DB: aimbank
      POSTGRES_USER: aimbank
      POSTGRES_PASSWORD: aimbank
      TZ: UTC
    ports:
      - "5432:5432"   # 로컬 PostgreSQL 이 5432 를 쓰고 있으면 둘 중 하나만 켠다 (docs/common/기술스택.md)
    volumes:
      - aimbank-pg:/var/lib/postgresql/data
volumes:
  aimbank-pg:
