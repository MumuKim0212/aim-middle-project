<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대출 서비스 프로토타입</title>
<style>
:root{
  --blue:#2f8ff0; --blue-d:#1f6fd1; --blue-l:#eaf4fe; --ink:#141414; --sub:#6b6b6b; --line:#e7e7e7;
  --bg:#eef1f5; --card:#fff; --ok:#16a34a; --ok-l:#e8f7ee; --warn:#d97706; --warn-l:#fff5e6; --ng:#dc2626; --ng-l:#fdecec;
  --grad:linear-gradient(90deg,#3b82f6,#a78bfa,#e879f9);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:var(--blue)}
.layout{display:flex;justify-content:center;align-items:flex-start;gap:20px}
.phone{flex:0 0 440px;width:100%;max-width:440px;height:100vh;overflow-y:auto;overflow-x:hidden;background:#fff;position:relative;box-shadow:0 0 30px rgba(0,0,0,.06)}
.side{display:flex;flex-direction:column}
.side>.screen{flex:1}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#888;padding:40px 30px;font-size:15px;line-height:1.6}
.empty svg{width:120px;height:110px;margin-bottom:16px}
.pc.sel{background:var(--blue-l)}
.pc.sel:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
.still .box,.still .doc,.still .reco,.still .fm,.still .verdict,.still .pc,.still .acc{animation:none}
.screen.still{animation:none}
/* 한 화면 전환: 좁은 화면(899px 이하)이거나 '모바일 보기'를 고르면 한 칸만 보이고 메인 ↔ 상세·신청을 전환 */
body.single .layout{display:block}
body.single .phone{margin:0 auto;height:auto;min-height:100vh;overflow:visible}
body.single.open .left{display:none}
body.single:not(.open) .side{display:none}
.viewsw{position:fixed;top:12px;right:16px;z-index:60;display:flex;background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.viewsw button{border:0;background:none;padding:7px 12px;border-radius:16px;font-size:13px;color:#555;white-space:nowrap}
.viewsw button.on{background:var(--blue);color:#fff;font-weight:700}
@media (max-width:899px){
  .viewsw{display:none}
  .layout{display:block}
  .phone{margin:0 auto;height:auto;min-height:100vh;overflow:visible}
  body.open .left{display:none}
  body:not(.open) .side{display:none}
}
/* header */
.hd{position:sticky;top:0;z-index:20;background:#fff;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 16px;border-bottom:1px solid var(--line)}
.hd h1{font-size:19px;margin:0;font-weight:700}
.ic{width:36px;height:36px;border:0;background:none;display:grid;place-items:center;border-radius:8px}
.ic:hover{background:#f4f4f4}
.ic svg{width:24px;height:24px;stroke:#222;fill:none;stroke-width:1.8}
/* tabs */
.tabs{display:flex;gap:6px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:56px;background:#fff;z-index:19}
.tab{border:0;background:none;padding:14px 12px 12px;font-size:16px;color:#333;position:relative;white-space:nowrap}
.tab.on{color:var(--blue);font-weight:700}
.tab.on:after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;background:var(--blue);border-radius:2px;animation:grow .3s}
.tab.off{color:#bbb}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* hero */
.hero{position:relative;overflow:hidden;background:#fff;border-bottom:8px solid #f3f5f8}
.slides{display:flex;transition:transform .6s cubic-bezier(.6,.05,.25,1)}
.slide{min-width:100%;padding:34px 24px 26px;cursor:pointer;position:relative}
.slide .k{font-size:28px;line-height:1.35;color:#555;font-weight:300}
.slide .pn{display:inline-block;margin-top:14px;font-weight:700;font-size:15px;padding-bottom:6px;border-bottom:1.5px solid #222}
.slide .badge{display:inline-block;margin-top:28px;background:#1f5fbf;color:#fff;font-size:12px;font-weight:700;padding:3px 7px;border-radius:2px}
.slide .amt{font-size:46px;font-weight:300;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:4px}
.slide .go{margin-top:18px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;justify-content:center}
.slide .art{position:absolute;right:22px;bottom:70px;width:120px;height:110px;opacity:.95}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.dots{display:flex;gap:6px;justify-content:center;padding-bottom:14px}
.dot{width:7px;height:7px;border-radius:50%;background:#d6d6d6;border:0;padding:0;transition:.3s}
.dot.on{width:20px;border-radius:4px;background:var(--blue)}
/* chips */
.chips{display:flex;gap:8px;padding:14px 16px 6px;overflow-x:auto}
.chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 14px;font-size:14px;white-space:nowrap;color:#444}
.chip.on{border-color:var(--blue);color:var(--blue);background:var(--blue-l);font-weight:700}
/* product card */
.pc{padding:22px 20px 22px 24px;border-bottom:1px solid var(--line);position:relative;cursor:pointer;animation:fadeUp .45s both}
.pc:hover{background:#fafcff}
.pc .s{font-size:15px;color:var(--sub)}
.pc .n{font-size:21px;font-weight:700;margin:6px 0 10px;letter-spacing:-.3px}
.pc .m{font-size:15px;color:#333}
.pc .m b{font-size:21px;color:var(--blue);font-weight:600;margin-left:4px}
.pc .m .tr,.big-m .tr{font-size:13px;color:#666;margin-left:10px;padding-left:10px;border-left:1px solid #d6d6d6;font-weight:400;white-space:nowrap}
.err{color:var(--ng);font-size:13px;font-weight:700;margin-top:6px;display:none}.err.on{display:block;animation:pop .3s}
input.bad{border-color:var(--ng);background:#fff7f7}
.pc .chev{position:absolute;right:18px;top:34px;width:12px;height:12px;border-right:1.5px solid #999;border-top:1.5px solid #999;transform:rotate(45deg)}
.pc .tag{position:absolute;right:44px;top:24px;font-size:11px;padding:2px 7px;border-radius:10px;background:#f1f3f6;color:#555}
.obtn{margin-top:16px;border:1px solid var(--blue);color:var(--blue);background:#fff;font-weight:700;font-size:15px;padding:7px 11px;border-radius:2px}
.obtn:hover{background:var(--blue-l)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.screen{animation:slideIn .35s ease both}
@keyframes slideIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
/* drawer */
.drawer{position:fixed;top:0;bottom:0;left:0;width:440px;z-index:50;overflow:hidden;pointer-events:none;visibility:hidden;transition:visibility 0s .35s}
.drawer.open{visibility:visible;transition:none}
.drawer .pane{width:100%;background:#fff;height:100%;transform:translateX(100%);transition:transform .35s ease;pointer-events:auto;display:flex;flex-direction:column}
.drawer.open .pane{transform:none}
.drawer:not(.open) .pane{pointer-events:none}
.dr-top{padding:30px 24px 20px;border-bottom:1px solid #ccc;position:relative}
.dr-r button.on{color:var(--blue)}
.dr-r button.on:after{content:"현재 화면";float:right;font-size:12px;font-weight:400;color:var(--blue)}
.dr-top .lg{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600}
.dr-top p{margin:12px 0 0;color:#555;font-size:14px}
.dr-top .x{position:absolute;right:18px;top:20px}
.dr-body{flex:1;display:flex;min-height:0}
.dr-l{width:30%;background:#f1f1f1;overflow:auto}
.dr-l button{display:block;width:100%;text-align:left;border:0;background:none;padding:20px 18px;font-size:16px;color:#333}
.dr-l button.on{background:var(--blue);color:#fff;font-weight:700}
.dr-r{flex:1;overflow:auto;padding:0 22px}
.dr-r button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:22px 14px;font-size:16px;font-weight:600}
.dr-r button:hover{color:var(--blue)}
.dr-ft{background:#e2eded;text-align:center;padding:18px;font-size:15px;font-weight:700}
.dr-ft span{display:block;font-weight:400;font-size:12px;color:#555;margin-top:4px}
/* detail / flow */
.wrap{padding:20px}
.big-sub{color:var(--sub);font-size:15px}
.big-n{font-size:25px;font-weight:700;margin:8px 0 6px;letter-spacing:-.4px}
.big-m{font-size:16px}.big-m b{font-size:30px;color:var(--blue);font-weight:600;margin-left:4px}
.info{width:100%;border-collapse:collapse;margin-top:18px;font-size:14px}
.info th{width:30%;text-align:left;color:#555;font-weight:600;padding:11px 0;border-bottom:1px solid var(--line);vertical-align:top}
.info td{padding:11px 0;border-bottom:1px solid var(--line);line-height:1.5}
.sec{font-size:16px;font-weight:700;margin:26px 0 10px}
.flowmap{display:flex;flex-wrap:wrap;gap:6px}
.fm{font-size:12px;padding:5px 8px;border-radius:12px;background:#f2f5f9;color:#445;animation:fadeUp .4s both}
.fm b{color:var(--blue);font-weight:700;margin-right:3px}
.cta{position:sticky;bottom:0;width:100%;padding:28px 16px 16px;background:linear-gradient(rgba(255,255,255,0),#fff 40%);z-index:30;display:flex;gap:8px;margin-top:auto}
.btn{flex:1;border:0;background:var(--blue);color:#fff;font-size:17px;font-weight:700;padding:15px;border-radius:8px;transition:.2s}
.btn:hover{background:var(--blue-d)}
.btn:disabled{background:#c9d6e6;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue);flex:.55}
.prog{height:4px;background:#eef2f7;position:sticky;top:56px;z-index:18}
.prog i{display:block;height:100%;background:var(--blue);transition:width .5s}
.stepinfo{padding:16px 20px 4px;font-size:13px;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
.code{font-size:11px;background:#f1f5fb;color:#3b5b8a;padding:3px 7px;border-radius:10px;font-weight:700}
.st-t{font-size:22px;font-weight:700;padding:4px 20px 2px;letter-spacing:-.3px}
.st-d{font-size:14px;color:var(--sub);padding:4px 20px 8px;line-height:1.55}
.box{border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;background:#fff;animation:fadeUp .35s both}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lbl{font-size:13px;color:#555;margin:14px 0 6px;font-weight:600}
input[type=text],input[type=number],select{width:100%;padding:12px;border:1px solid #d9d9d9;border-radius:8px;font-size:15px;font-family:inherit;background:#fff}
input:focus,select:focus{outline:2px solid var(--blue-l);border-color:var(--blue)}
.unit{position:relative}.unit span{position:absolute;right:12px;top:12px;color:#888;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ck{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
.ck input{width:20px;height:20px;margin:0;accent-color:var(--blue);flex:none}
.ck .t{flex:1;line-height:1.45}
.req{font-size:11px;color:var(--ng);font-weight:700;margin-right:4px}.opt{font-size:11px;color:#888;font-weight:700;margin-right:4px}
.view{font-size:12px;white-space:nowrap}
.all{background:var(--blue-l);border-radius:10px;padding:14px;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid #d9d9d9;background:#fff;border-radius:8px;padding:9px 12px;font-size:14px}
.seg button.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue);font-weight:700}
.doc{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:10px;margin:8px 0;animation:fadeUp .35s both}
.doc .ico{width:38px;height:44px;border-radius:5px;background:#f2f5f9;display:grid;place-items:center;font-size:11px;color:#58708f;font-weight:700;flex:none}
.doc .i{flex:1;min-width:0}.doc .i b{display:block;font-size:14px}.doc .i small{display:block;color:#777;font-size:12px;margin-top:3px;word-break:break-all}
.fbtn{border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:6px;padding:8px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.st{font-size:12px;font-weight:700;padding:2px 7px;border-radius:10px;display:inline-block}
.st.ok{background:var(--ok-l);color:var(--ok)}.st.ng{background:var(--ng-l);color:var(--ng)}.st.wa{background:var(--warn-l);color:var(--warn)}.st.no{background:#f1f1f1;color:#888}
.pipe{margin:8px 0}
.pi{display:flex;gap:12px;align-items:flex-start;padding:10px 0;opacity:.35;transition:.3s}
.pi.on{opacity:1}
.pi .b{width:26px;height:26px;border-radius:50%;border:2px solid #cfd8e3;display:grid;place-items:center;font-size:13px;flex:none;background:#fff}
.pi.run .b{border-color:var(--blue);border-top-color:transparent;animation:spin .8s linear infinite}
.pi.ok .b{background:var(--ok);border-color:var(--ok);color:#fff}
.pi.ng .b{background:var(--ng);border-color:var(--ng);color:#fff}
.pi.wa .b{background:var(--warn);border-color:var(--warn);color:#fff}
.pi .tx{flex:1}.pi .tx b{display:block;font-size:15px}.pi .tx small{color:#666;font-size:13px;line-height:1.45}
@keyframes spin{to{transform:rotate(360deg)}}
.verdict{border-radius:14px;padding:22px 18px;text-align:center;margin:12px 0;animation:pop .45s both}
.verdict .v{font-size:24px;font-weight:800}.verdict p{margin:8px 0 0;font-size:14px;line-height:1.5}
.verdict.ok{background:var(--ok-l);color:#14532d}.verdict.wa{background:var(--warn-l);color:#7c3d00}.verdict.ng{background:var(--ng-l);color:#7f1d1d}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.rc{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f1f1f1;font-size:14px}
.rc code{font-size:11px;background:#f3f4f6;padding:2px 6px;border-radius:4px;color:#374151;height:fit-content;white-space:nowrap}
.reco{border:1.5px solid var(--line);border-radius:12px;padding:16px;margin:10px 0;cursor:pointer;transition:.2s;animation:fadeUp .4s both;position:relative}
.reco.on{border-color:var(--blue);box-shadow:0 4px 14px rgba(47,143,240,.15)}
.reco .best{position:absolute;top:-10px;left:14px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px}
.reco h4{margin:2px 0 8px;font-size:16px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px;color:#444}
.kv b{color:var(--ink)}
.vchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.vc{font-size:11px;padding:3px 7px;border-radius:10px;background:#f1f1f1;color:#999;transition:.3s}
.vc.pass{background:var(--ok-l);color:var(--ok);font-weight:700}
table.t{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{background:#f7f9fc;color:#444;font-weight:600}
.scroll{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13px;line-height:1.65;background:#fbfcfe}
.q{padding:10px 0;border-bottom:1px solid #f1f1f1;font-size:14px}
.q .seg{margin-top:8px}
.sum{background:#f7f9fc;border-radius:12px;padding:16px;margin:10px 0}
.sum .big{font-size:28px;font-weight:800;color:var(--blue)}
.okcircle{width:84px;height:84px;margin:30px auto 10px;border-radius:50%;background:var(--ok);display:grid;place-items:center;animation:pop .5s both}
.okcircle svg{width:46px;height:46px;stroke:#fff;stroke-width:4;fill:none;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:11px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;z-index:90;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.25s}
.sheet.open{opacity:1;pointer-events:auto}
.sheet .in{background:#fff;width:100%;max-width:440px;border-radius:18px 18px 0 0;max-height:86vh;overflow:auto;padding:20px;transform:translateY(40px);transition:.3s}
.sheet.open .in{transform:none}
.sheet h3{margin:0 0 6px;font-size:19px}
.acc{border:1px solid var(--line);border-radius:12px;padding:18px;margin:12px 16px;animation:fadeUp .4s both}
.acc .n{font-weight:700;font-size:17px}.acc .acctno{font-size:14px;color:#555;margin-top:12px}.acc .acctno b{color:var(--ink);letter-spacing:.3px}.acc .bal{font-size:26px;font-weight:700;margin:2px 0 8px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.acts button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 4px;font-size:13px}
.acts button:hover{border-color:var(--blue);color:var(--blue)}
.note{font-size:12px;color:#777;line-height:1.55;padding:6px 20px}
.foot{font-size:11px;color:#999;text-align:center;padding:24px 16px;line-height:1.6}
.cmp td.g{color:var(--ok);font-weight:700}.cmp td.b{color:var(--ng);font-weight:700}
.demo{background:linear-gradient(135deg,#f5f8ff,#fdf5ff);border:1px dashed #b9c8ef;border-radius:12px;padding:14px;margin-top:20px}
.demo b{font-size:14px}.demo p{font-size:12px;color:#666;margin:6px 0 10px;line-height:1.5}
.caution{font-size:12px;color:#777;margin-top:12px;padding-top:9px;border-top:1px dashed #e1e1e1;line-height:1.5}
.law{color:var(--blue);text-decoration:underline;cursor:pointer;font-weight:700}
.opt-card{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer;font-size:14px;line-height:1.5}
.opt-card.on{border-color:var(--blue);background:var(--blue-l)}
.opt-card.dis{opacity:.5;cursor:not-allowed}
.opt-card input{margin-top:3px;accent-color:var(--blue)}
.sheet-btns{display:flex;gap:8px;margin-top:14px}
.schedwrap{max-height:262px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}
.schedwrap table.t{margin-top:0}
.schedwrap thead th{position:sticky;top:0;z-index:1}
.schedwrap tfoot td{position:sticky;bottom:0;background:#f7f9fc;font-weight:700}
table.sched td,table.sched th{font-size:11.5px;padding:7px 4px;white-space:nowrap}
.bar{height:10px;border-radius:6px;background:#eef2f7;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;transition:width .8s}
@media (max-width:360px){.grid2{grid-template-columns:1fr}.slide .k{font-size:24px}}
/* ===== 디자인 시안 적용 (Design/디자인_가이드.md) ===== */
.screen.th{min-height:100vh;background:var(--tbg)}
.th-loan{--acc:#2f8ff0;--acc-l:#eaf4fe;--tbg:#eef1f5}
.th-refi{--acc:#22b281;--acc-l:#e5f7ef;--tbg:#f3faf8}
.th-manage{--acc:#3b9cf2;--acc-l:#e8f3ff;--tbg:#f3f7fc}
.th .tab.on{color:#1d2433}
.th .tab.on:after{background:var(--acc)}
.th .hero{background:transparent;border-bottom:0;padding-top:14px}
.th .slide{padding:0 16px}
.sbox{position:relative;border-radius:24px;padding:26px 22px 20px;overflow:hidden;min-height:268px}
.sbox .k{font-size:25px;line-height:1.35;font-weight:400}
.sbox .pn{display:inline-block;margin-top:10px;font-size:13.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.sbox .badge{display:inline-block;margin-top:20px;color:#fff;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.sbox .amt{position:relative;z-index:1;font-size:38px;font-weight:800;letter-spacing:-1px;margin-top:2px}
.sbox .go{margin-top:12px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.sbox .go span{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;color:#fff}

const fmt = n => Math.round(n).toLocaleString("ko-KR");
const won = n => fmt(n) + "원";
function kwon(n){ n = Math.round(n); if (n < 0) return "-" + kwon(-n); if (n < 1e4) return fmt(n) + "원"; const e = Math.floor(n/1e8), m = Math.round((n % 1e8)/1e4); let s=""; if(e) s += e+"억"; if(m) s += (e?" ":"") + m.toLocaleString("ko-KR") + "만"; if(!e && !m) return fmt(n)+"원"; return s+"원"; }
function monthly(P, rate, n, method){ const r = rate/1200; if (method==="만기일시상환") return P*r; if (method==="원금균등분할") return P/n + P*r; return r ? P*r/(1-Math.pow(1+r,-n)) : P/n; }
function totalInterest(P, rate, n, method){ const r = rate/1200; if (method==="만기일시상환") return P*r*n; if (method==="원금균등분할") return P*r*(n+1)/2; return monthly(P,rate,n,method)*n - P; }
function annualForDsr(P, rate, n, method, cat){
  if (cat==="JEONSE" || cat==="DEPOSIT") return P*rate/100;   // 전세·예금담보: 이자만 반영 (예시)
  if (method==="만기일시상환") return P/Math.max(n/12,1) + P*rate/100;
  return monthly(P,rate,n,method)*12;
}
function baseRate(){ return 3.10; }
function estRate(p, score, income){
  const [lo, hi] = p.rate;
  if (p.type==="POLICY") return +(lo + (income > 6e7 ? 0.5 : income > 4e7 ? 0.25 : 0)).toFixed(2);
  if (p.type==="INST" && p.sub2==="B") return +(lo + (score < 800 ? 0.4 : 0)).toFixed(2);
  const r = lo + Math.max(0, (920 - score))/100 * 0.9;
  return +Math.min(hi, Math.max(lo, r)).toFixed(2);
}
function scen(){ return SCN[S.scn || "NONE"] || {}; }
function score(){ const sc = scen(); return sc.score || (S.profile.delinq1y ? 690 : 820); }
function refiTargets(){ return S.existing.filter((e,i)=>S.targets[i]); }
function refiAmount(){ return refiTargets().reduce((a,e)=>a + e.bal + prepayFee(e), 0); }
function prepayFee(e){ return e.since >= 36 ? 0 : Math.round(e.bal * e.prepay/100 * (e.remain/e.total)); }

function evaluate(){
  const p = S.product, pr = S.profile, sc = scen(), st = [];
  const income = pr.income || 0, sco = score();
  const amt = p.type==="REFI" ? refiAmount() : pr.amount;
  const n = pr.term, rate = estRate(p, sco, income), stress = rate + 1.0;
  if (S.suitOverride) st.push({n:"적합성 확인", s:"wa", t:"적합성 부적합 상태 · 고객이 고지를 확인하고 심사 진행에 동의함 (suitability_override 기록)"});
  // 1 KO
  const ko = []; if (sc.delinqCurrent) ko.push("KO-DELINQ-CURRENT"); if (sc.bizClosed) ko.push("KO-BIZ-CLOSED");
  st.push({n:"결격(KO) 확인", s: ko.length?"ng":"ok", t: ko.length? ko.map(c=>RC[c]).join(" / ") : "현재 연체·회생·명의도용·폐업 없음"});
  // 2 소득
  const inc = [];
  if (p.cat!=="DEPOSIT" && income < 2e7) inc.push("INC-BELOW-MIN");
  if (p.cat!=="DEPOSIT" && pr.job==="급여소득자" && pr.tenure < 12) inc.push("INC-TENURE-SHORT");
  st.push({n:"소득 확정", s: inc.length?"ng":"ok", t:`확정 연 소득 ${kwon(income)} (공공 연동 > 서류 > 고객 진술 순 채택)` + (inc.length? " · "+inc.map(c=>RC[c]).join(" / "):"")});
  // 3 신용
  const crd = []; if (sco < 600) crd.push("CRD-SCORE-LOW"); if ((sc.multiDebt||0) >= 5) crd.push("CRD-MULTI-DEBT"); if ((sc.inquiries||0) >= 7) crd.push("CRD-INQUIRY-MANY");
  st.push({n:"신용평가", s: crd.length?"ng":"ok", t:`신용평점 ${sco}점 · 예상 금리 연 ${rate.toFixed(2)}%` + (crd.length? " · "+crd.map(c=>RC[c]).join(" / "):"")});
  // 4 DSR
  const excl = p.type==="REFI" ? refiTargets().reduce((a,e)=>a+e.monthly,0) : 0;
  const existA = Math.max(0, pr.debtM - excl) * 12;
  const dsrAt = A => (existA + annualForDsr(A, stress, n, pr.repay, p.cat)) / Math.max(income,1);
  const dsr = dsrAt(amt);
  let lo = 0, hi = p.max;
  if (dsrAt(p.max) <= 0.4) lo = p.max;                       // 상품 최대에서도 기준 이내면 여유 한도 = 상품 최대
  else for (let i=0;i<40;i++){ const mid=(lo+hi)/2; if (dsrAt(mid) <= 0.4) lo = mid; else hi = mid; }
  const dsrRoom = Math.floor(lo/1e6)*1e6;
  st.push({n:"DSR 계산", s: dsr<=0.4?"ok":(dsrRoom>=p.min?"wa":"ng"), t:`DSR ${(dsr*100).toFixed(1)}% (스트레스 금리 ${stress.toFixed(2)}% 적용, 한도 40%)${p.type==="REFI"?" · 대환 대상 상환분 제외":""} · DSR 여유 한도 ${kwon(dsrRoom)}`});
  // 5 담보
  const colHard = [], colCond = []; let collLimit = Infinity, colTxt = "담보 없음 (신용)";
  if (p.cat==="MORTGAGE"){ collLimit = pr.value*0.7 - pr.senior; if (amt > collLimit) colCond.push("COL-LTV-OVER"); colTxt = `시세 ${kwon(pr.value)} · LTV ${(amt/pr.value*100).toFixed(1)}% · 담보 한도 ${kwon(collLimit)}`; }
  if (p.cat==="JEONSE"){ const over = pr.senior + pr.deposit > pr.value*0.9; if (over){ if (pr.senior>0) colHard.push("COL-SENIOR-LIEN"); colHard.push("COL-DEPOSIT-OVER-VALUE"); } collLimit = pr.deposit*0.8; colTxt = `(선순위 ${kwon(pr.senior)} + 보증금 ${kwon(pr.deposit)}) ÷ 시세 ${kwon(pr.value)} = ${((pr.senior+pr.deposit)/pr.value*100).toFixed(0)}% · 보증금의 80% 한도 ${kwon(collLimit)}`; }
  if (p.cat==="AUTO"){ collLimit = pr.price*0.9; colTxt = `차량 가격 ${kwon(pr.price)} · 한도(90%) ${kwon(collLimit)}`; }
  if (p.cat==="DEPOSIT"){ collLimit = pr.depBal*0.95; colTxt = `담보 예금 ${kwon(pr.depBal)} · 한도(95%) ${kwon(collLimit)}`; }
  st.push({n:"담보·보증 평가", s: colHard.length?"ng":colCond.length?"wa":"ok", t: colTxt + ([...colHard,...colCond].length? " · "+[...colHard,...colCond].map(c=>RC[c]).join(" / "):"")});
  // 6 한도
  const limit = Math.max(0, Math.floor(Math.min(p.max, dsrRoom, collLimit)/1e6)*1e6);
  st.push({n:"한도 산출", s:"ok", t:`min(상품 ${kwon(p.max)}, DSR 여유 ${kwon(dsrRoom)}, 담보 ${collLimit===Infinity?"-":kwon(collLimit)}) = ${kwon(limit)}`});
  // 7 판정
  const hard = [...ko, ...inc, ...crd, ...colHard, ...(dsrRoom < p.min ? ["DSR-OVER"] : [])];
  const docD = S.defects.slice();
  let res, cond = [];
  if (hard.length) res = "REJECTED";
  else if (docD.length) res = "DOCS_REQUIRED";
  else if (limit < amt){ res = "COND_APPROVED"; if (dsr>0.4) cond.push("DSR-OVER"); cond.push(...colCond); }
  else res = "APPROVED";
  st.push({n:"판정", s: res==="APPROVED"?"ok":res==="REJECTED"?"ng":"wa", t: {APPROVED:"승인",COND_APPROVED:"조건부 승인 (감액)",DOCS_REQUIRED:"서류 보완 요청",REJECTED:"거절"}[res]});
  return {res, stages:st, hard, docD, cond, limit, rate, dsr, amt, score:sco};
}

function countUp(){
  const el = document.getElementById("cu"); if (!el) return; const v = +el.dataset.v, t0 = performance.now();
  const step = t => { const k = Math.min(1,(t-t0)/900), e = 1-Math.pow(1-k,3); el.textContent = kwon(v*e).replace("원",""); if (k<1) requestAnimationFrame(step); else el.textContent = kwon(v).replace("원",""); };
  requestAnimationFrame(step); setTimeout(()=>{ el.textContent = kwon(v).replace("원",""); }, 1000);
}
function startFlow(){ const p = PRODUCTS.find(x=>x.id===S.pid); resetFlow(p); S.screen = "flow"; render(); }
function goBack(){
  if (S.screen==="detail"){ goHome(); return; }
  if (S.screen==="flow"){ if (S.step===0){ S.screen="detail"; render(); } else { S.step--; render(); } }
}

let NEXT = {label:"다음", ok:true, fn:null}, AFTER = null;
function renderFlow(){
  const p = S.product, key = S.flow[S.step], meta = STEP[key];
  NEXT = {label:"다음", ok:true, fn:null}; AFTER = null;
  const body = STEPS[key]();
  const pct = ((S.step+1)/S.flow.length*100).toFixed(0);
  return `<div class="screen">${header(p.name, "back")}<div class="prog"><i style="width:${pct}%"></i></div>
   <div class="stepinfo"><span>${S.step+1} / ${S.flow.length} 단계 · ${TYPE_NM[p.type]}</span><span class="code">${meta.c} · ${meta.code[p.type]||""}</span></div>
   <div class="st-t">${meta.n}</div>${body}</div>
   <div class="cta">${S.step>0 && key!=="done"?`<button class="btn ghost" onclick="goBack()">이전</button>`:""}<button class="btn" id="nextBtn" ${NEXT.ok?"":"disabled"} onclick="doNext()">${NEXT.label}</button></div>`;
}
function afterFlowRender(){ if (AFTER) AFTER(); }
function doNext(){ if (NEXT.fn && NEXT.fn()===false) return; S.step = Math.min(S.step+1, S.flow.length-1); render(); }
/* 대출·대환 불가로 더 진행할 수 없을 때: 하단 버튼을 비활성화하지 않고 '처음으로'로 바꿉니다 */

/* C06 결과 + 추천 */
result(){
  const R = S.review, p = S.product;
  if (R.res==="REJECTED" || R.res==="DOCS_REQUIRED") return verdictBlock(R);
  const amt = Math.min(S.profile.amount, R.limit);
  if (!S.reco){
    const vars = [{n:"비대면 전용형",d:-0.15,rt:"변동"},{n:"변동금리형",d:0,rt:"변동"},{n:"고정금리형",d:0.3,rt:"고정"}].map(v=>{
      const r = +(R.rate + v.d).toFixed(2), ti = totalInterest(amt, r, S.profile.term, S.profile.repay), m = monthly(amt, r, S.profile.term, S.profile.repay);
      return {...v, r, ti, m, pref: (S.profile.ratePref.startsWith(v.rt)||S.profile.ratePref==="상관없음")?1:0.2};
    });
    const mn = Math.min(...vars.map(v=>v.ti)), mx = Math.max(...vars.map(v=>v.ti));
    vars.forEach(v=>{ v.score = 0.4*(1-(v.ti-mn)/(mx-mn+1)) + 0.2 + 0.15*(1-Math.min(v.m/(S.profile.income/12)/0.7,1)) + 0.1*v.pref + 0.15; });
    vars.sort((a,b)=>b.score-a.score); S.reco = vars;
  }
  setTimeout(()=>setNext(true)); NEXT.label = "이 상품으로 진행";
  NEXT.fn = () => { const v = S.reco[S.sel]; S.chosen = v; S.profile.amount = amt; };
  AFTER = () => { document.querySelectorAll(".vc").forEach((c,i)=>setTimeout(()=>c.classList.add("pass"), 120*i)); };
  const V = ["V1 스키마","V2 상품 실재","V3 수치 일치","V4 근거","V5 금지 표현","V6 필수 주의","V7 순위 보존","V8 재계산","V9 적합성"];
  const extra = p.type==="POLICY"?["GV1 정책 금리","GV2 공고 버전","GV3 의무 고지"]:p.type==="INST"?["IV1 보증료","IV2 실질 비용","IV4 협약 금리"]:[];
  return `<div class="wrap" style="padding-top:8px">
   <div class="verdict ${R.res==="APPROVED"?"ok":"wa"}"><div class="v">${R.res==="APPROVED"?"승인":"조건부 승인"}</div><p>승인 한도 <b>${kwon(R.limit)}</b> · 예상 금리 연 ${R.rate.toFixed(2)}%${R.cond.length?"<br>"+R.cond.map(c=>RC[c]).join("<br>")+" → 한도 감액":""}</p></div>
   <div class="sec">고객님께 권장하는 상품 <small style="font-weight:400;color:#888">총 이자 기준 · 수익성 미반영</small></div>
   ${S.reco.map((v,i)=>`<div class="reco ${S.sel===i?"on":""}" style="animation-delay:${i*90}ms" onclick="S.sel=${i};document.querySelectorAll('.reco').forEach((e,j)=>e.classList.toggle('on',j===${i}))">${i===0?`<span class="best">조건에 가장 유리</span>`:""}<h4>${p.name.split(" (")[0]} · ${v.n}</h4>
     <div class="kv"><span>금리 <b>연 ${v.r.toFixed(2)}% (${v.rt})</b></span><span>월 상환 <b>${kwon(v.m)}</b></span><span>총 이자 <b>${kwon(v.ti)}</b></span><span>추천 점수 <b>${(v.score*100).toFixed(0)}</b></span></div>
     <div style="font-size:13px;color:#444;margin-top:8px;line-height:1.5">${i===0?`후보 중 총 이자가 가장 적습니다(약 ${kwon(v.ti)}).`:`총 이자는 1위보다 약 ${kwon(v.ti-S.reco[0].ti)} 많습니다.`} ${v.rt==="변동"?"<br>⚠ 변동금리는 시장 금리가 오르면 월 상환액이 늘 수 있습니다.":"<br>금리가 고정되어 월 상환액이 바뀌지 않습니다."}${p.type==="POLICY"?"<br>⚠ 정책 의무: 전입·실거주, 추가 주택 취득 금지 (LN-21)":""}</div>
     <div class="vchips">${[...V,...extra].map(x=>`<span class="vc">${x}</span>`).join("")}</div></div>`).join("")}
   <div class="note">추천 사유 문장은 LLM-8이 만들고 검증 레이어(V1~V9)를 통과한 경우에만 보여 줍니다. 실패하면 고정 템플릿 문장을 보여 줍니다.</div></div>`;

/* R08·R09 대환 비교 */
compare(){
  const R = S.review, p = S.product;
  if (R.res==="REJECTED" || R.res==="DOCS_REQUIRED") return verdictBlock(R);
  const t = refiTargets(), newRate = R.rate, n = S.profile.term, rem = Math.max(...t.map(e=>e.remain));
  const bal = t.reduce((a,e)=>a+e.bal,0), cost = t.reduce((a,e)=>a+prepayFee(e),0) + (bal>5e7?35000:0);
  const oldInt = t.reduce((a,e)=>a + (e.bullet? e.bal*e.rate/1200*e.remain : totalInterest(e.bal,e.rate,e.remain,"원리금균등분할")),0);
  const meth = S.profile.repay;
  const principal = refiAmount();                              // 잔액 + 중도상환수수료 (조건·금리·완료 화면과 같은 금액)
  const newInt = totalInterest(principal, newRate, n, meth), oldM = t.reduce((a,e)=>a+e.monthly,0), newM = monthly(principal, newRate, n, meth);
  const net = oldInt - newInt - cost; let be = 0, acc = 0; for (let m=1;m<=n;m++){ acc += (oldM - newM); if (acc >= cost){ be = m; break; } }
  const verdict = net > 0 ? "BENEFICIAL" : (oldM-newM > 0 ? "TRADE_OFF" : "NOT_BENEFICIAL");
  S.cmp = {net, verdict, n, newRate, bal, cost, meth};
  if (verdict==="BENEFICIAL" || S.override){ setTimeout(()=>setNext(true)); NEXT.label = "대환 진행"; } else stopHere();
  return `<div class="wrap" style="padding-top:8px">
   <div class="verdict ${verdict==="BENEFICIAL"?"ok":verdict==="TRADE_OFF"?"wa":"ng"}"><div class="v">${{BENEFICIAL:"갈아타면 이득",TRADE_OFF:"월 부담만 감소",NOT_BENEFICIAL:"갈아타면 손해"}[verdict]}</div><p>순 절감액 <b>${kwon(net)}</b>${be?` · ${be}개월째부터 이득`:""}</p></div>
   <table class="t cmp"><tr><th>항목</th><th>기존</th><th>대환 후</th></tr>
    <tr><td>기간</td><td>남은 ${rem}개월</td><td>${n}개월 (고객 선택)</td></tr>
    <tr><td>금리</td><td>연 ${(t.reduce((a,e)=>a+e.rate*e.bal,0)/bal).toFixed(2)}%</td><td class="g">연 ${newRate.toFixed(2)}%</td></tr>
    <tr><td>월 납입액</td><td>${won(oldM)}</td><td class="${newM<oldM?"g":"b"}">${won(newM)}</td></tr>
    <tr><td>남은 총 이자</td><td>${won(oldInt)}</td><td class="${newInt<oldInt?"g":"b"}">${won(newInt)}</td></tr>
    <tr><td>대환 비용 (중도상환수수료·인지세 예시)</td><td>-</td><td>${won(cost)}</td></tr>
    <tr><td><b>순 절감액</b></td><td></td><td class="${net>0?"g":"b"}"><b>${won(net)}</b></td></tr></table>
   <div class="vchips" style="margin-top:12px">${["RV1 절감액 재계산","RV2 판정-문장 일치","RV3 비용 고지","RV4 기간 함정","RV5 불리 대환 미권장","RV6 데이터 최신성"].map(x=>`<span class="vc pass">${x}</span>`).join("")}</div>
   ${verdict!=="BENEFICIAL"?`<label class="ck" style="margin-top:10px"><input type="checkbox" ${S.override?"checked":""} onchange="S.override=this.checked;render()"><span class="t">불리하다는 고지를 확인했으며 그래도 진행합니다 (refi_override 기록)</span></label>`:""}
   <div class="note">${docLink("RF",10,"대환대출 비교 안내서 (RF-10)")}</div></div>`;
},

    <div class="row" style="margin-top:10px"><b>최종 금리</b><b style="font-size:24px;color:var(--blue)">연 ${fin.toFixed(2)}%</b></div></div>

   ${items.map((t,i)=>`<label class="ck"><input type="checkbox" ${S.cc[i]?"checked":""} onchange="S.cc[${i}]=this.checked;render()"><span class="t">${t}</span></label>`).join("")}

function suitPlan(){
  const p = S.product, pr = S.profile, R = p.type==="REFI", rate = p.rate[1], r = rate/1200;
  const excl = R ? refiTargets().reduce((a,e)=>a+e.monthly,0) : 0;
  const budget = 0.7*pr.income/12 - Math.max(0, pr.debtM - excl);
  const amt = R ? refiAmount() : pr.amount, n = pr.term, m = pr.repay;
  let maxAmt = null, minTerm = null, exactTerm = null;
  if (budget > 0 && !R){
    let a = m==="만기일시상환" ? budget/r : m==="원금균등분할" ? budget/(1/n + r) : budget*(1-Math.pow(1+r,-n))/r;
    a = Math.floor(Math.min(a, p.max)/1e6)*1e6;
    if (a >= p.min) maxAmt = a;
  }
  if (budget > 0 && m!=="만기일시상환"){
    for (let t=1; t<=600; t++){ if (monthly(amt, rate, t, m) <= budget){ exactTerm = t; break; } }
    minTerm = p.terms.slice().sort((x,y)=>x-y).find(t => monthly(amt, rate, t, m) <= budget) || null;
  }
  return {budget, amt, rate, maxAmt, minTerm, exactTerm, m, n, R};
}

    : {k:"B", ok:false, t:`<b>기간 조정</b><br><small>${P.m==="만기일시상환"?"만기일시상환은 기간을 바꿔도 월 이자가 같아 기준 안에 들어올 수 없습니다.":P.budget<=0?"기존 대출 월 상환액만으로 기준을 넘어 기간을 늘려도 기준 안에 들어올 수 없습니다.":P.exactTerm?`계산상 ${P.exactTerm}개월이 필요하지만, 상품 최대 기간(${Math.max(...p.terms)}개월)을 넘습니다.`:"기간을 늘려도 기준 안에 들어올 수 없습니다."}</small>`});

  S._adj = (opts.find(o=>o.ok && o.k!=="C") || opts[2]).k;

/* M01 상환 스케줄: 현재 잔액에서 잔액이 0원이 될 때까지 남은 회차를 모두 계산 (표는 6회차까지 보이고 나머지는 스크롤) */
function fullSchedule(l){
  const paid = Math.min(Math.max(monthsBetween(l.start, today), 0), l.term - 1);
  const remain = Math.max(l.term - paid, 1), r = l.rate/1200, rows = [];
  let bal = l.balance;
  const pay = l.repay==="원리금균등분할" ? monthly(bal, l.rate, remain, l.repay) : 0;
  for (let k=1; k<=remain && bal > 0.5; k++){
    const it = bal*r; let pp;
    if (l.repay==="만기일시상환") pp = k===remain ? bal : 0;
    else if (l.repay==="원금균등분할") pp = l.balance/remain;
    else pp = pay - it;
    if (k===remain || pp > bal) pp = bal;                      // 마지막 회차에서 잔액을 0원으로 정리
    bal = Math.max(bal - pp, 0);
    const due = new Date(l.start); due.setMonth(due.getMonth() + paid + k);
    rows.push({seq: paid + k, due, pp, it, total: pp + it, bal});
  }
  return {paid, remain, rows};
}

  openSheet(`<h3>M08 기간연장</h3><p style="font-size:13px;color:#666">연장 시점에 다시 심사합니다 (결격·신용·DSR·담보). ${docLink("LN",28,"신청서")}</p><div class="lbl">연장 기간</div><select id="exM"><option value="12">12개월</option><option value="24">24개월</option></select><div id="exR"></div><button class="btn" style="width:100%;margin-top:12px" onclick="exDo(${i})">연장 신청</button>`); }
function exDo(i){ const l = LOANS[i], m = +document.getElementById("exM").value, list = [{n:"결격 확인",t:"연체 없음"},{n:"신용 재평가",t:"등급 유지"},{n:"DSR 재계산",t:"기준 이내"},{n:"변경 약정·새 스케줄",t:"교부"}];
  document.getElementById("exR").innerHTML = pipeHtml(list,"exx"); anim(list,"exx",()=>{ l.term += m; toast(`만기가 ${m}개월 연장되었습니다`); setTimeout(()=>{ closeSheet(); render(); }, 700); }, 550); }
function mCert(i){ const l = LOANS[i];
  openSheet(`<h3>M10 증명서 발급</h3>${["대출 잔액증명서","이자 납입증명서","완제 확인서"].map((t,k)=>`<div class="doc"><div class="ico">PDF</div><div class="i"><b>${t}</b><small>발급번호 CT-${l.no}-${k+1} · 해시 기록</small></div><button class="fbtn" ${k===2&&l.status!=="PAID_OFF"?"disabled":""} onclick="toast('${t} 발급 (데모)')">발급</button></div>`).join("")}<button class="btn" style="width:100%;margin-top:10px" onclick="closeSheet()">닫기</button>`); }

/* 화면 보기 방식: single = 한 화면에서 메인 ↔ 상세·신청 전환(기본), split = 좌우 분할 */
function setView(v){
  S.view = v === "split" ? "split" : "single";
  document.body.classList.toggle("single", S.view === "single");
  const a = document.getElementById("vwSingle"), b = document.getElementById("vwSplit");
  if (a) a.classList.toggle("on", S.view === "single"); if (b) b.classList.toggle("on", S.view === "split");
  try { localStorage.setItem("loanProtoView", S.view); } catch(e) {}
  window.scrollTo(0, 0);
}
let savedView = "single"; try { savedView = localStorage.getItem("loanProtoView") || "single"; } catch(e) {}
setView(savedView);
S.scn = "NONE"; S.payDay = 25;
render();
